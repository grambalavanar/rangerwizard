# # =============================================================================
# # SELF-HOSTED RUNNER SETUP (one-time, on your Mac)
# # =============================================================================
# #
# # A self-hosted runner is a small background agent on your Mac that listens to
# # GitHub and executes workflow jobs locally. It has full access to 127.0.0.1
# # so it can reach TWS.
# #
# # Steps:
# #   1. Go to:  github.com/<your-username>/rangerwizard
# #              → Settings → Actions → Runners → New self-hosted runner
# #   2. Select macOS / ARM64, then follow the displayed commands:
# #        mkdir actions-runner && cd actions-runner
# #        curl -O -L https://github.com/actions/runner/releases/download/v2.x.x/actions-runner-osx-arm64-2.x.x.tar.gz
# #        tar xzf ./actions-runner-osx-arm64-2.x.x.tar.gz
# #        ./config.sh --url https://github.com/<user>/rangerwizard --token <TOKEN>
# #   3. Install as a macOS service (runs automatically on login, restarts on crash):
# #        ./svc.sh install
# #        ./svc.sh start
# #   4. Verify the runner appears as "Idle" on the GitHub Runners page.
# #
# # DST clock change:
# #   Both cron lines are always active — daily_signal.py guards against running
# #   outside the 9:30–10:15 AM ET window, so the "off-season" trigger exits
# #   immediately. No manual cron edits needed when clocks change.
# #
# # Market holidays:
# #   GitHub cron does not know about NYSE holidays (e.g. July 4, Thanksgiving).
# #   On those days TWS will be closed and daily_signal.py will fail gracefully
# #   (no data returned → symbols skipped → logged as ERROR). This is safe.
# # =============================================================================
